plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bootlog.capture'
    compileSdk 34

    defaultConfig {
        applicationId "com.bootlog.capture"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 本工程不依赖任何第三方库（无 AndroidX / Kotlin），可直接离线构建
