name: Build APK

# 触发条件：
#   - push 到 main        → 构建并上传 artifact
#   - push tag v*         → 构建 + 创建 GitHub Release 并附上 APK
#   - 手动触发             → 可指定版本号
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 1.3（留空则使用 AndroidManifest 中的版本）"
        required: false
        type: string

# 创建 Release 需要写权限；其余只读
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android@v3：它内部会执行 `sdkmanager tools`，
      # 而 tools 包早已从 Google 仓库移除，导致 "Failed to find package 'tools'" 并退出 1。
      # runner 镜像本身预装了 Android SDK，这里直接复用并只装需要的组件。
      - name: 安装 platform 与 build-tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          # 万一镜像不再预装 SDK，就自己下载 commandline-tools（固定版本，可复现）
          if [ ! -d "$SDK" ] || [ -z "$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null)" ]; then
            echo "未找到预装 SDK，下载 commandline-tools 13114758"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi

          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/build-tools"

      # 正式签名：在仓库 Settings → Secrets and variables → Actions 里配置
      #   ANDROID_KEYSTORE_BASE64  keystore 文件的 base64（base64 -w0 bootlog.keystore）
      #   ANDROID_KEYSTORE_PASS     storePassword
      #   ANDROID_KEY_ALIAS         keyAlias
      #   ANDROID_KEY_PASS          keyPassword
      # 未配置时 build.sh 会自动生成一个临时 keystore，产物仅供测试
      - name: 还原签名密钥
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "::notice::使用仓库 Secrets 中的正式签名密钥"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次使用临时签名，产物仅供测试"
          fi

      # tag v1.3 / 手动输入 1.3 → VERSION_NAME=1.3 VERSION_CODE=10300
      # versionCode 编码规则：major*10000 + minor*100 + patch，保证单调递增
      - name: 解析版本号
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$VER" ]; then
            CODE=$(echo "$VER" | awk -F. '{printf "%d%02d%02d", $1+0, $2+0, $3+0}')
            echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
            echo "本次版本：$VER ($CODE)"
          else
            echo "沿用 AndroidManifest 中的版本号"
          fi

      - name: 构建
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          chmod +x build.sh
          # 固定 build-tools 版本，避免 runner 预装的更新版本改变 d8/aapt2 行为
          if [ -d "$ANDROID_SDK_ROOT/build-tools/34.0.0" ]; then
            export BUILD_TOOLS_DIR="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          fi
          ./build.sh

      - name: 校验产物并生成校验文件
        run: |
          set -e
          APK=$(ls build/BootLog-v*.apk | head -1)
          OUT_TXT="build/$(basename "${APK%.apk}")-sha256.txt"
          sha256sum "$APK" | awk '{print $1}' > /tmp/hash
          HASH=$(cat /tmp/hash)
          printf '%s  %s\n' "$HASH" "$(basename "$APK")" > "$OUT_TXT"

          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify -v "$APK" | head -6
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" dump badging "$APK" | head -2

          {
            echo "### 构建结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 文件 | \`$(basename "$APK")\` |"
            echo "| 大小 | $(du -h "$APK" | cut -f1) |"
            echo "| SHA-256 | \`$HASH\` |"
            echo "| 版本 | ${VERSION_NAME:-见清单} |"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootLog-apk
          path: |
            build/BootLog-v*.apk
            build/BootLog-v*-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          FILES=$(ls build/BootLog-v*.apk build/BootLog-v*-sha256.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "BootLog $TAG" \
              --generate-notes
          fi
          echo "已发布：${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
